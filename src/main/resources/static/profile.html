<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px;}
        button:hover { background-color: #004494; }
        .logout-btn { background-color: #dc3545; margin-top: 15px; }
        .logout-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pengaturan Profil</h2>
    <form id="profileForm">
        <div class="form-group">
            <label>Email (Tidak bisa diubah)</label>
            <input type="text" id="email" disabled>
        </div>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>Nomor HP</label>
            <input type="text" id="phoneNumber">
        </div>
        <div class="form-group">
            <label>Alamat</label>
            <textarea id="address" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Bio Singkat</label>
            <textarea id="bio" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>URL Foto Profil</label>
            <input type="text" id="profilePictureUrl" placeholder="https://...">
        </div>
        <button type="submit">Simpan Perubahan</button>
    </form>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/index.html';
    }

    async function loadProfile() {
        try {
            const response = await fetch('/api/profile', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById('email').value = data.email || '';
                document.getElementById('name').value = data.name || '';
                document.getElementById('phoneNumber').value = data.phoneNumber || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('bio').value = data.bio || '';
                document.getElementById('profilePictureUrl').value = data.profilePictureUrl || '';
            } else {
                alert('Sesi habis. Silakan login kembali.');
                logout();
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const updatedData = {
            name: document.getElementById('name').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            address: document.getElementById('address').value,
            bio: document.getElementById('bio').value,
            profilePictureUrl: document.getElementById('profilePictureUrl').value
        };

        try {
            const response = await fetch('/api/profile', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(updatedData)
            });

            if (response.ok) {
                alert('Profil berhasil diupdate!');
            } else {
                alert('Gagal mengupdate profil.');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/index.html';
    }

    loadProfile();
</script>

</body>
</html>
