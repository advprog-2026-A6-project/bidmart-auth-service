server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:h2:mem:testdb}
    username: ${SUPABASE_DB_USERNAME:sa}
    password: ${SUPABASE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:BidMartSuperSecretKeyForAuthenticationAdvProg2026PalingAmanDiDunia}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

auth:
  email:
    delivery-mode: ${AUTH_EMAIL_DELIVERY_MODE:SMTP}
    from-address: ${AUTH_EMAIL_FROM:no-reply@bidmart.local}
    application-name: ${AUTH_EMAIL_APP_NAME:BidMart}
  session:
    max-concurrent-sessions: ${AUTH_MAX_CONCURRENT_SESSIONS:3}
    expiry-days: ${AUTH_SESSION_EXPIRY_DAYS:7}
    overflow-policy: ${AUTH_SESSION_OVERFLOW_POLICY:REVOKE_OLDEST}
  verification:
    email-expiry-hours: ${AUTH_EMAIL_VERIFICATION_EXPIRY_HOURS:24}
    login-challenge-expiry-minutes: ${AUTH_LOGIN_CHALLENGE_EXPIRY_MINUTES:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false

staging:
  links:
    frontend-url: ${FRONTEND_STAGING_URL:not-set}
    backend-url: ${BACKEND_STAGING_URL:not-set}
    database-url: ${DATABASE_STAGING_URL:not-set}
