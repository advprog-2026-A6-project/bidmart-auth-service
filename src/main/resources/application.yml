auth:
  email:
    delivery-mode: ${AUTH_EMAIL_DELIVERY_MODE:SMTP}
    from-address: ${AUTH_EMAIL_FROM:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:no-reply@bidmart.local}}}
    application-name: ${AUTH_EMAIL_APP_NAME:BidMart}
  internal:
    service-token: ${AUTH_INTERNAL_SERVICE_TOKEN:bidmart-internal-dev-token}
  events:
    retry-delay-ms: ${AUTH_EVENT_RETRY_DELAY_MS:10000}
  session:
    max-concurrent-sessions: ${AUTH_MAX_CONCURRENT_SESSIONS:3}
    expiry-days: ${AUTH_SESSION_EXPIRY_DAYS:7}
    overflow-policy: ${AUTH_SESSION_OVERFLOW_POLICY:REVOKE_OLDEST}
  verification:
    email-expiry-hours: ${AUTH_EMAIL_VERIFICATION_EXPIRY_HOURS:24}
    login-challenge-expiry-minutes: ${AUTH_LOGIN_CHALLENGE_EXPIRY_MINUTES:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    rabbit:
